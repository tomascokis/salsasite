services:
  salsasite-dev:
    build:
      context: /mnt/user/fastdata/server/salsasite-dev
      dockerfile: docker/Dockerfile.dev
    image: salsasite-dev:live
    container_name: salsasite-dev
    environment:
      PORT: 5173
      HOST: 0.0.0.0
      LIVE_ROOT: /server/live
      DATA_DIR: /server/live/data/live
      MEDIA_ROOT: /server/live/data/live/media/video-moves
      SOURCE_ROOT: /server/live/data/live/media/video-sources
      POSTER_ROOT: /server/live/data/live/media/video-posters
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    ports:
      - "18096:5173"
    restart: unless-stopped
    volumes:
      - /mnt/user/fastdata/server/salsasite-dev:/server/live
